# Leukos_laser.proto

# stream protocol file for Leukos supercontinuum laser

# Mark Rivers
# September 15, 2026

ExtraInput = Ignore;

setOnOff {
   out "*lase %d";
   in  "";
}

getOnOff {
   out "*lase";
   in  "%d";
}

setStandby {
   out "*copo %d";
   in  "";
}

getStandby {
   out "*copo";
   in  "%d";
}

getSerialNumber {
   out "*sern";
   in  "%d";
}

getTemperature {
   out "*mede";
   in  "%d %(\$1)d";
}

getStatus {
   out "*regi";
   in  "%1b%(\$1)1b%(\$2)1b%(\$3)1b%(\$4)2b";
}

setMode {
   out "*mode %d";
   in  "";
}

getMode {
   out "*mode";
   in "%d";
}

setPeriod {
   out "*tino %06d %(\$1)06d";
   in  "";
}

getPeriod {
   out "*tino";
   in "%d %(\$1)d";
}
